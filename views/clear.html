<!DOCTYPE html>
<html lang="en">

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Clean Out Existing Serviceworker and Cache for a Fresh Start">
    <title>GeoTour ServiceWorker Flush</title>
    <link id="favicon" rel="icon" href="/assets/favicon.ico" type="image/x-icon">
<style>
body {
  font-family: helvetica, arial, sans-serif;
  font-size:3vh;
  margin: 2em;
  background-color:#0c2a45;
  color: gold;
}
  ul {background-color:white; color: black;}
  div {border: thick solid gold;}
  footer { font-size: 4em; text-align: center; margin:auto;}
  
</style>  

  </head>

  
  
  <body>
    <header><h1>GEOTOUR FLUSH</h1></header>   

    <main>
      <div><ul id="console"  ></ul></div>

    </main> 

    <footer><div><b>Games</b>That<b>Work</b>.com</div></footer> 
  
  
  <script>
    
    const log= t=> document.querySelector('#console' ).innerHTML+= `<li>${t}</li>`;
     
    fetch("cache://menu")
      .then( response => response.text())
      .then( text => document.innerHTML = text )
      .catch( error => log(`cachemenu Fetch error: ${error.message}`) ); 
    
    setTimeout( ()=>window.location.href="cache:menu", 30000);
    log( "Cache Killer: ");
    </script>
  
  
  
  
  
  </body>
  
  
  
</html>
