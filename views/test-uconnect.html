<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech on Uconnect</title>

<style type="text/css">
    * { box-sizing: border-box; margin:0; padding:0; }
    main    {   background-color: #0a597d; 
                height:100vh; width:100vw;
                padding:2em; margin:0;
                display: flex; flex-direction: column; gap:1em;
                justify-content: space-around; align-items: stretch;}
    main>* { background-color: #0f3a4e;
             border-radius: 4vmin;
             padding: 0.751em; 
             border: thick solid #74c0e3;
             color:   #bbe8fc;; font-size: 4vh; text-align: center;
             font-family: 'Courier New', Courier, monospace ;
             font-weight:900;
             /* flex:2= 1 1 auto; */
            }
    main *:hover {
        background-color: #88d9ff;
             border: thick solid #74c0e3;
                color: #006c9e;
            }


</style>

<script defer>

const say = (phrase) => new Promise( (resolve, reject) => {
    const utterance = new SpeechSynthesisUtterance(phrase);
    utterance.onend = resolve;
    utterance.onerror = reject;
    speechSynthesis.speak(utterance);
    });


const play  = track => new Promise( (resolve, reject) => {
    setTimeout( ()=> {
            document.querySelectorAll('audio').forEach(audio=> audio.pause() );
            if( !track ) return resolve();
            document.querySelector(`#${track}`).play();    
            setTimeout( ()=> resolve(), 1000 );
            }, 1000 );
    });



const quiet = `\r\n\r\n\r\n\r\n`;

window.onload = () => {
    const speechSynthesis = window.speechSynthesis;
    const testPhrase = 'Now hear this';
    const menu = document.querySelector('main');

    const actions = {
        plain:       ()=> say(            testPhrase           ),

        pad:         ()=> say( `        ${testPhrase}        ` ),

        punctuate:   ()=> say( `${quiet}${testPhrase}${quiet}` ),

        promise:     ()=> say(    quiet                        )
              .then( ()=> say(            testPhrase          ))
              .then( ()=> say(                         quiet  )),

        process:     ()=> play(  "noise"                       )
              .then( ()=> say(            testPhrase          ))
              .then( ()=> play(                        false  )),

        play:        ()=> play(  "silence"                     )
              .then( ()=> say(            testPhrase          ))
              .then( ()=> play(                        false  ))
       };

    Object.keys( actions ).forEach( key => {
        const button = document.createElement('div');
        button.textContent = key.toUpperCase();
        button.addEventListener('click', actions[key]);
        menu.appendChild(button);
        });

};

</script></head>
<body>
    <main></main>
    <audio id="silence" src="https://geo-tour.s3-us-west-2.amazonaws.com/silence.ogg" preload="auto" ></audio>
    <audio id="noise"   src="https://geo-tour.s3-us-west-2.amazonaws.com/noise.ogg"   preload="auto" ></audio> 
</body>
</html>
