const l2m   =  l => l*111000;
const m2l   =  m => m/111000;
const l2p   =  l => Math.round(
                    map.project( [     defaultPin.lat, defaultPin.lng] ).y -
                    map.project( [ l + defaultPin.lat, defaultPin.lng] ).y); 
const perill = (c,r,θ) =>[ c.lat + r * Math.sin( θ+4*Math.PI ), c.lng + r * Math.cos( θ+4*Math.PI ) ];
const xy2ll  =  p  => map.unproject( L.point(  p  ).add(       map.getPixelBounds().min ).round() );    
const ll2xy  =  w  => map.project(             w  ).subtract(  map.getPixelBounds().min ).round()  ;

const dbg=  e => {
  const dom = {
      unit: document.querySelector("#dbg"),
      json: document.querySelector("#json"),
      from: e.target
      };
  var fromStyleDisplay  = dom.from.style.display;

  const self = {
    open: e=>{
        dom.from.style.display= 'none';
        dom.unit.style.display="block";  
        dom.json.innerHTML = 
             `<DIV    class="msg"     ></DIV>
              <BUTTON class="edit"    >edit</BUTTON>
              <BUTTON class="close"   >close</BUTTON>
              <PRE    class="language-javascript"
                          data-src="plugins/toolbar/prism-toolbar.js"
                          data-label="Tour in JSON"><CODE  contentEditable>${JSON.stringify( tour.dna,null,2)}</CODE></PRE>`;
        dom.code= dom.json.querySelector("CODE");
        dom.json.querySelector(".close"  ).addEventListener("click", self.close  );
     // dom.json.querySelector(".save"   ).addEventListener("click", self.memo   );
     // dom.json.querySelector(".load"   ).addEventListener("click", self.omem   );
        dom.json.querySelector(".edit"   ).addEventListener("click", self.edit   );
        dom.json.querySelector(".refresh").addEventListener("click", self.refresh);
        dragEnable( "#dbg"  );
        },
    close: e=>{ 
        e.stopPropagation();
        dom.json.querySelector(".close"  ).removeEventListener("click", self.close  );
    //  dom.json.querySelector(".save"   ).removeEventListener("click", self.memo   );
    //  dom.json.querySelector(".load"   ).removeEventListener("click", self.omem   );
        dom.json.querySelector(".edit"   ).removeEventListener("click", self.edit   );
        dom.json.querySelector(".refresh").removeEventListener("click", self.refresh);
        dom.json.innerHTML=null; 
        dom.unit.style.display ="none";  
        dom.from.style.display = fromStyleDisplay;
      },
    edit:    e=>  tour= newTour(  {json: dom.json.querySelector("CODE").innerText } ),
    refresh: e=>  dom.code.innerText =JSON.stringify( tour.dna,null,2 ),
    memo:    e=>  localStorage.setItem('tour',  dom.code.innerHTML    ),
    omem:    e=>  dom.code.innerHTML = localStorage.getItem('tour'    )
    }
  self.open();
}

const testdrive = (newTour, useGPS)  =>{ // both optional
    const gps = useGPS;
    var car, currentTour, active;
    const bit = .0005;
    var gpsWatch = false;
    const dom={};
    const count={ ok:0,fail:0 };
    const move={ now:{lat:0,lng:0} };
    const positionOptions   =   {
        enableHighAccuracy: false,
        timeout:    5000,
        maximumAge:    0,
        gpsTTL:        3,
        gpsWatch:      0
        } ;
    const msg= text =>  dom.unit.innerText=text;
    var self = {
        process: event => {
            move.then= move.now;
            move.now =
                    event.latlng            // leaflet/mouseevent
                || {                        // gps event
                    lat: event.coords.latitude,
                    lng: event.coords.longitude,
                    };
  //          mapbase.setView( move.now, gps? 17:16);
            if( car ) car.remove();
            car = L.imageOverlay(  url.active.car, [[ move.now.lat-bit, move.now.lng-bit],[  move.now.lat+bit, move.now.lng+bit]] )
               .addTo( mapbase ); ;
             
            ;
            currentTour.children.forEach(  pin => 
                pin.children.forEach( zone=> 
                    zone.trigger( move ) ));
          // msg( `${++count.ok} OK  || ${  count.fail} FAIL` );
            },
        fail: error=>{
            msg( `${  count.ok} OK  || ${++count.fail} FAIL [${error.message}]` );
            },
        install: t =>{
            if( gps  )
                gpsWatch= navigator.geolocation.watchPosition( self.process, self.fail, positionOptions );
            else{
                mapbase.on(  "mousemove", self.process );
                document.getElementById('mapid').style.cursor = 'none';
                }
            currentTour = t || tour;
            currentTour.close();
            dom.unit = document.createElement("div");     
            currentTour.dom.unit.appendChild( dom.unit)  
 
          
          
          
          
 
            dom.carbutton = document.createElement("button");     
            dom.carbutton.innerText="CENTER CAR";
            currentTour.dom.unit.appendChild( dom.carbutton);
            dom.carbutton.addEventListener("click", e=>
                    mapbase.setView( move.now, 17    ));/*
            dom.spacerbutton = document.createElement("div");
            dom.spacerbutton.innerText="adjustments";
            currentTour.dom.unit.appendChild( dom.spacerbutton);
          */
            dom.cachebutton = document.createElement("button");     
            dom.cachebutton.innerText="CACHE";
            currentTour.dom.unit.appendChild( dom.cachebutton);
            dom.cachebutton.addEventListener("click", e=> 
                    window.open("cachemenu", "cache"      ));
   
            dom.timebutton = document.createElement("button");     
            dom.timebutton.innerText= positionOptions.timeout;
            currentTour.dom.unit.appendChild( dom.timebutton);
            dom.timebutton.addEventListener("click", e=>{
                    positionOptions.timeout = (positionOptions.timeout+=500)%8000;
                    dom.timebutton.innerText=  positionOptions.timeout;
                    navigator.geolocation.clearWatch(gpsWatch);
                    gpsWatch= navigator.geolocation.watchPosition( self.process, self.fail, positionOptions );
                    });
   
            dom.accubutton = document.createElement("button");     
            dom.accubutton.innerText= positionOptions.enableHighAccuracy? "HIGH ACCURACY":"LOW ACCURACy";
            currentTour.dom.unit.appendChild( dom.accubutton);
            dom.accubutton.addEventListener("click", e=>{
                    positionOptions.enableHighAccuracy = !positionOptions.enableHighAccuracy;
                          dom.accubutton.innerText= positionOptions.enableHighAccuracy? "HIGH ACCURACY":"LOW ACCURACy";
                    navigator.geolocation.clearWatch(gpsWatch);
                    gpsWatch= navigator.geolocation.watchPosition( self.process, self.fail, positionOptions );
                    });
   /*   
            dom.button = document.createElement("button");     
            dom.button.innerText="END DRIVE";
            currentTour.dom.unit.appendChild( dom.button);
            dom.button.addEventListener("click", self.toggle );
   
          
  currentTour.dom.unit.parent.querySelector("#editor").style.display="none";
   */         msg( gps? "GPS Installed":"GPS simulator");
            active= true;
            },
        exstall: ()=>{
            msg( "====Test Drive Ended======");
            if( gpsWatch) {
                navigator.geolocation.clearWatch(gpsWatch);
                gpsWatch= null;
                }
            if (!gps ){
                document.getElementById('mapid').style.cursor = 'grab';
                mapbase.off( "mousemove", self.process );
                }

            if( car ) car.remove();
            //msg( "");
            dom.unit.remove();
            dom.button.removeEventListener("click", self.toggle );
            dom.button.remove();
            dom.unit=dom.button= null;
            currentTour.open();
            active= false;
            },
        toggle: e=> active? self.exstall() : self.install( newTour ),     
        }
    return self.toggle;
    }

 const fixx={ 
  prev: {lat:0,lng:0}, 
  options: {  enableHighAccuracy: true,  timeout: 5000,  maximumAge: 0 },
  count:0,
  read: fix=>{
    fixx.gui =document.querySelector("#editor>div.form>div.body");
    const bit = .0005;
 //decode

 //flash

 //trigger

        pin.children.forEach( zone=> 
             zone.trigger( pos ) ));

    },
  fail: err=>{
    fixx.map.classList.add("fail");
    fixx.next();
    },
  next: ()=>{}, 
  get:  ()=>navigator.geolocation.getCurrentPosition( fixx.read, fixx.fail, fixx.options ),
  start: ()=> {
    fixx.map =document.querySelector("#mapid");
    fixx.gui =document.querySelector("#editor>div.form>div.body");
    fixx.next = fixx.get;
    fixx.get();

}

const newTour =  context=> {

    if( tour && tour.destruct )  tour.destruct(); //singularity for now

    const dna =  context.tour
        || (context.json? JSON.parse(context.json):false ) // deprecate this!
        || proto.tour;
    const dom ={            // all DOM nodes that display tour components
        root: context.dom || document.querySelector("#editor"), // pre-exisiting DOM anchor
        unit: false,        // contains interactive html representation of this tour
        head: false,         // miminimized html representation
        body: false,         // head+body = maximized representation
        field:{}             // a graph of data fields
        };
    const map={};    
    const self=   {
        parent:         null,        // maybe we will edit multiple tours one day
        siblings:       [],          // maybe we will edit multiple tours one day    
        children:       [],
        
        get dna()         {  return dna  }, 
        get dom()         {  return dom  }, 
        get id()          {  return dna.id  || dna.author+".tour_"+idcounter.tour++      }, 
        get name()        {  return String(dna.name || dna.notes || dna.id || "Tour" ).substring(0,24)  }, 
        get notes() {  return dna.notes ||    "[unnamed tour]"          },
        get lat()      { return dna.center.lat; },
        get lng()      { return dna.center.lng; },
        get latlng()   { return dna.center;     },
        set lat(l)     { dna.center.lat= l; },
        set lng(l)     { dna.center.lng= l; },
        set latlng(ll) { dna.center    =ll; },

        construct: ()=>{   
          
          
            traceStep( self, 'construct');
            map.base = mapbase;
            if( dna.center )   map.base.setView( dna.center, 13);
            
            dom.unit = document.createElement("div");
            dom.unit.id= self.id;
            dom.unit.className= "tour form";
            dom.unit.innerHTML=`
                <div class="head handle" >
                    <h2 class="name">${self.name}</h2>
                    </div>
                <div class="body" >
                    <div    class="row">
                        <button class="realdrive"  >DRIVE </button>
                        <br/><br/><br/>
                        <button class="testdrive"  >TEST DRIVE </button>
                        <button class="add pin-add">ADD PIN</button>
                        <button class="json"       >JSON </button>
                        <button class="audio"     >TEST SOUND </button>
                        <button class="upload"     >UPLOAD </button>
                        <span class="pin-count"></span>
                        </div>
                    <ul  class="pin-list"></ul>
                    </div>`;
            while (dom.root.firstChild) dom.root.removeChild( dom.root.firstChild );  // clean root before rooting    
        
            dom.root.appendChild( dom.unit );
            dom.head = dom.unit.querySelector(".head");
            dom.body = dom.unit.querySelector(".body");
            dom.field.name = dom.unit.querySelector(".handle");
            dom.field.name.addEventListener("click", e=>console.log(self) );
            dom.unit.querySelector(".realdrive").addEventListener( "click", ()=>fixx.start()         ); // called at click time
//          dom.unit.querySelector(".realdrive").addEventListener( "click", testdrive( self, true  ) ); // called at construct time, not click time
            dom.unit.querySelector(".testdrive").addEventListener( "click", testdrive( self, false ) ); // returns a function
            dom.unit.querySelector(".audio"    ).addEventListener( "click", testaudio                ); // returns a function
            dom.body.querySelector(".pin-add"  ).addEventListener( "click", self.spawn               );
            dom.body.querySelector(".upload"   ).addEventListener( "click", self.upload              );
            dom.body.querySelector(".json"     ).addEventListener( "click", dbg                      );
         
            dragEnable( "#editor"  );
            map.base.on('contextmenu', self.spawnhere );
            self.close();
            },
        open: ()=>{
            traceStep( self, 'open');
            self.render( {status:"open"} );
            self.children.forEach( p=>p.open());
            dom.head.removeEventListener( 'click',     self.open  );
            dom.head.addEventListener(    'click',     self.close );   
            //handleEvents( dom.field, "change", self.exform, true );

/*            Object.keys( dom.field ).forEach( k=>{
                if( typeof k==='object' )   
                        Object.keys( dom.field[k] ).forEach( kk=>
                            dom.field[k][kk].addEventListener( "change", self.exform ))
                else        dom.field[k].addEventListener( "change", self.exform ) 
                });*/
            },
        start: ()=>{
            traceStep( self, 'start');
            },
        update: ()=>{
            traceStep( self, 'update');
            },
        end: ()=>{
            traceStep( self, 'end');
            },
        close: ()=>{
            traceStep( self, 'close');
            self.render( {status:"close"} );
            self.children.forEach( p=>p.close()); 
            dom.head.removeEventListener(  'click',     self.close  );   
            map.base.off( 'contextmenu', self.spawnhere );
            dom.head.addEventListener(     'click',     self.open   );
            //handleEvents( dom.field, "change", self.exform, false );
            },
        hide: ()=>{
            traceStep( self, 'hide');
            self.render( {status:"hide"} );
            },
        destruct: ()=>{
            traceStep( self, 'destruct');
            self.close();
            self.children.forEach(p =>p.destruct()); 
            dom.head.removeEventListener( 'click',         self.close  );   
            dom.head.removeEventListener( 'click',         self.open   );   
            dom.head.removeEventListener( 'mousedown',     self.start  );
            if( dom.unit ) dom.unit.remove();
            dom.unit=null;
            },
        render: dnaUpdate =>{
            traceStep( self, 'render');
            Object.assign(   dna, self.exform(), dnaUpdate || {} );
            self.inform( dna );
            dom.unit.style.display = (dna.status=="hide" )?'none':'block';  
            dom.body.style.display = (dna.status=="close")?'none':'block';  
            self.children.forEach( p=> p.render() );
            },
        exform: ()=> {
            return  dom.unit?  {
                //id:"",
                name: dom.field.name.innerText
                // notes =dom.unit.querySelector(".notes").innerText;
                // dna.tag        =dom.unit.querySelector(".tag").value;
                // status: "neutral",  // initial state of play or edit-state
                // zone: [],       
                }:{};
             },
        inform: d=>{
            //id:"",
            dom.field.name.innerText = d.name;
            // notes =dom.unit.querySelector(".notes").innerText;
            // dna.tag        =dom.unit.querySelector(".tag").value;
            // status: "neutral",  // initial state of play or edit-state
            // zone: [],       
            },

        spawnhere: e=> self.spawn( { class:"pin", name:"Pin "+idcounter.pin, latlng:e.latlng   } ),

        spawn: newdna=> {
            traceStep( self, 'spawn');
            if( "pin" !==   newdna.class   )  newdna= structuredClone( dna.pins[ dna.pins.length-1] );
            newdna.lat+=.005;
            newdna.lng+=.015;
          //{}; // no Event objects, etc
            if( !dna.pins.includes( newdna )) dna.pins.push( newdna);
            let p= newPin(  {
                dna:       newdna,
                parent:    self,        
                siblings:  self.children,
                dom:       dom.unit.querySelector(".pin-list"), 
                map:       map.base
                });
            self.children.push ( p );
            p.open();
            },
        upload: ()=>
            fetch(`https://geotour.glitch.me/tour/upload/${self.name}`, { method:'post', body:JSON.stringify(dna) })
                .then( response => response.text() )
                .then(      msg => alert(msg)),
        }
    self.construct();
    dna.pins.forEach( pdna => self.spawn( pdna ));
    self.open();
    return self;
    }

    render: update =>{
     //   traceStep( self, 'render');

        if (!update)    update={};
        let u= { max:update.max, min:update.min };
        delete update.max;
        delete update.min;
        
        Object.assign( dna, self.exform(), {...dna}, update || {} );
            
        if( u.max ) { dna.radius.max=u.max.radius; dna.sector.max=u.max.sector; }
        if( u.min ) { dna.radius.min=u.min.radius; dna.sector.min=u.min.sector;  }
        let r      =    Math.max( dna.radius.min, dna.radius.max);
        dna.radius.min =Math.min( dna.radius.max, dna.radius.min); 
        dna.radius.max =r; 
        let θMax = dna.sector.max + ((dna.sector.max>dna.sector.min)? 0 : 2*Math.PI);
        let θMin = dna.sector.min;
        let chord = 2*Math.PI/120;
        let outlines=[ [] ]; // an arrray of arrays (to support holes))
        let outline= outlines[0]; 
        if( !dna.sector.cut ) {
            θMin=-1.5*Math.PI; 
            θMax= 0.5*Math.PI;
            } 
                    // draw arc
        for ( let   θ=θMin;   θ<θMax;  θ+= chord)
            outline.push(      perill( self.parent, dna.radius.max, θ ));
        outline.push(         perill( self.parent, dna.radius.max, θMax ));
        if(   !dna.radius.cut &&  dna.sector.cut )  outline.push( perill( self.parent, 0, 0 ));
        if(    dna.radius.cut && !dna.sector.cut )  outlines.push( outline=[] );
        if(    dna.radius.cut  )  { 
            for ( let   θ=θMax;   θ>θMin;  θ-= chord)
                outline.push( perill( self.parent, dna.radius.min, θ ));
            outline.push(     perill( self.parent, dna.radius.min, θMin ));
            }    

        if( map.arc ) map.arc.remove();
        if( map.handle.ctr ) map.handle.ctr.remove();
        if( map.handle.max ) map.handle.max.remove();
        if( map.handle.min ) map.handle.min.remove();

        map.arc = L.polygon( outlines, statusStyle[ dna.status ] ).addTo( map.root );
        map.arc.on(                'click', self.open );

        let closed = !" open start update end".match( dna.status );
        if( closed )         
            dom.body.style.display = 'none';
        else   {        
            map.handle.ctr =L.circle( self.parent, {radius: l2m(dna.radius.max/35), color:"black",  name:"ctr"}).addTo(map.root);
            map.handle.max =L.circle(perill( self.parent, dna.radius.max, dna.sector.max), {radius: l2m(dna.radius.max/35), color:"blue",  name:"max"}).addTo(map.root);
            map.handle.min =L.circle(perill( self.parent, 
                dna.radius.cut? dna.radius.min : dna.radius.max ,
                dna.sector.cut? dna.sector.min : dna.sector.max),
                { radius: (dna.radius.cut || dna.sector.cut)? l2m(dna.radius.max/35):0, 
                color:"orange", name:"min"  }).addTo(map.root);

            dom.body.style.display = 'block';
            dom.field.radius.max.classList.toggle( 'highlight', u.max );
            dom.field.radius.min.classList.toggle( 'highlight', true || u.min );
            dom.field.sector.max.classList.toggle( 'highlight', u.max );
            dom.field.sector.min.classList.toggle( 'highlight', u.min );
            }

       self.inform( dna );
        },

    inform: d=>{
        const scale ={ radius: d=>d*111320, sector: r=>(450-(r*180/Math.PI))%360 };

        ["name","class","id","notes","content","status"].forEach( k=>
            dom.field[ k ].innerText= d[k] || "" );

        if( d.trigger ){
            dom.field.trigger.cycle.value = d.trigger.cycle;
            ["in","out"].forEach( io=>
                dom.field.trigger[io].checked= d.trigger[io] );     
            }
        if( d.radius && d.sector ){
            ["radius","sector"].forEach( rs=>
                dom.field[rs]["cut"].checked = !!d[rs]["cut"]);

            ["radius","sector"].forEach( rs=>
                ["max","min"].forEach( mmc=>
                    dom.field[rs][mmc].value = 
                        Math.round( scale[rs]( d[rs][mmc] ))));
            }       
      // kloogey patch
                 dom.field.content.addEventListener("change", e=> d.content = dom.field.content.innerText );
           },
    xxform: ()=> Object.assign( dna, self.exform()  ),    
    exform: ()=>{ 
        const scale ={ radius: m=>m/111320, sector: d=>((630-d)%360-180)/(180/Math.PI) };
        let d={ radius:{}, sector:{},trigger:{} };

        ["radius","sector"].forEach( rs=> 
            d[rs]["cut"]= !!dom.field[rs]["cut"].checked );
        ["radius","sector"].forEach( rs=>
            ["max","min"].forEach( mmc=>
                d[rs][mmc]= scale[rs]( dom.field[rs][mmc].value )));

        ["name","class","id","notes","content","status"].forEach( k=>
                d[k] = dom.field[ k ].innerText);
        ["in","out"].forEach( io=>
            d.trigger[io] =  dom.field.trigger[io].checked);     
        d.trigger.cycle   =  dom.field.trigger.cycle.value;

        
    //    console.log("exform:", dom, d);
        return d;
        //return { trigger:{in:true, out:true, cycle:-9999} };// { trigger:d.trigger };
        },    
 
    detect: p =>{  // in LatLan space
      
      

      
        let dLat = p.lat - self.parent.lat; //pin.latlng.lat;  
        let dLng = p.lng - self.parent.lng; //pin.latlng.lng;      ;
        let r  = Math.sqrt(  dLat*dLat + dLng*dLng );
        let s  = Math.atan2( dLat,dLng )  ;

        while(  s               <  dna.sector.min )
                s               += Math.PI*2;
        while(  dna.sector.max  <  dna.sector.min )
                dna.sector.max  += Math.PI*2;

        return                         (r< dna.radius.max) 
            &&   (!dna.radius.cut ||   (r> dna.radius.min) )
            &&   (!dna.sector.cut || ( (s> dna.sector.min) 
                                    && (s< dna.sector.max) ) );
        },

    detectVector: v =>{  // in LatLan space
/*      
        if(   dna.sector.cut===true ){
          if( dna.sector.min > dna.sector.max ){
            let big = dna.sector.min;
            dna.sector.min = dna.sector.max;
            dna.sector.max = big;
            }
           dna.sector.cut==="ok";
          }
      
      */
      
        let dLat = v.now.lat - self.parent.lat; //pin.latlng.lat;  
        let dLng = v.now.lng - self.parent.lng; //pin.latlng.lng;      
        let r  = Math.sqrt(  dLat*dLat + dLng*dLng );
        let s  = Math.atan2( dLat,dLng )  ;
        let oLat = v.then.lat - self.parent.lat; //pin.latlng.lat;  
        let oLng = v.then.lng - self.parent.lng; //pin.latlng.lng;      
        
      
        while(  s               <  dna.sector.min )
                s               += Math.PI*2;
        while(  dna.sector.max  <  dna.sector.min )
                dna.sector.max  += Math.PI*2;

        return                         (r< dna.radius.max) 
            &&   (!dna.radius.cut ||   (r> dna.radius.min) )
            &&   (!dna.sector.cut || ( (s> dna.sector.min) 
                                    && (s< dna.sector.max) )
            && ((dLat*dLat+dLng*dLng)<0.95*(oLat*oLat+oLng*oLng))
            );
        },
      
   
 

    perform: () =>{
        self.exform();//let t = String( dna.content  )
          
        let str= String(dna.content)      
        if( str.endsWith(".mp3") || str.endsWith(".ogg")|| str.endsWith(".wav") ) 
            audio.promise( dna.content );
        else{
      			speechSynthesis.cancel()
            let utt = new SpeechSynthesisUtterance(dna.content);
            utt.pitch = 0.8;
            utt.rate  = 0.8;
            if( audio.player ) {
                audio.player.pause();
                utt.addEventListener( "end", ()=>audio.player.play() );
            }
            speechSynthesis.speak( utt );
            }
       console.log(  dna.content );
       },    
    
    trigger: probe =>  {
        if( dna.status!="spent" 
            && (    (probe.now && self.detectVector( probe ))
                 || (probe.lat && self.detect( probe ))      )   ){        
            self.perform( dna.content );
            if( dna.trigger.cycle ) 
                setTimeout( ()=>self.render( {status:"close"}), dna.trigger.cycle*300 )//1000
            self.render( {status:"spent"});
            }
        }
    };
    self.construct();
    self.close();
    return self;
    } 


      
const  audio= {
      player:null,
      promise:  (content)=>    new Promise( (resolve, reject)=> {
        let src = "https://geo-tour.s3-us-west-2.amazonaws.com/cherokee/"+content;
        if( audio.player?.currentSrc==src )		return resolve();
		    if( audio.player ){
            audio.player.dispatchEvent( new Event("ended"));
            }
        audio.player= new Audio( src );
        audio.player.volume = content.volume ?? 1 ;
        audio.player.addEventListener( "canplay", audio.player.play  );
			  audio.player.addEventListener( "error",   reject );
			  audio.player.addEventListener( "ended", ()=>{
          audio.player.pause();
          audio.player.remove();
          audio.player=null;
          resolve ();
          }); 
	  		})
      };

  
  
  
  
  



const dragEnable = (selector, handleselector=".handle") => {
    var x=0, y=0, dx=0, dy=0;
    var element= document.querySelector( selector );
    var handle = element.querySelector(  handleselector ) || element.firstChild || element;
//console.log("DRAG HANDLE", element, handle)
    var drag= {
        mouseDown:  e => {
            e = e || window.event;
            e.preventDefault();
            x = e.clientX;
            y = e.clientY;
            document.onmouseup   = drag.end;
            document.onmousemove = drag.update;
            },
        update:     e=> {
            e = e || window.event;
            e.preventDefault();
            dx = e.clientX - x;    x = e.clientX;  
            dy = e.clientY - y;    y = e.clientY;
            element.style.left  = (element.offsetLeft + dx ) + "px";
            element.style.top   = (element.offsetTop  + dy ) + "px";
            },
        end:  e=>  document.onmouseup =  document.onmousemove = null
        }
        handle.onmousedown = drag.mouseDown;
    }
