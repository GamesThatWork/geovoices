steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/geotour:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/geotour:latest',
      '.'
    ]

  # Push the container images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/geotour:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/geotour:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy', 'geotour',
      '--image=gcr.io/$PROJECT_ID/geotour:$COMMIT_SHA',
      '--region=us-central1',
      '--platform=managed',
      '--allow-unauthenticated',
      '--port=3000',
      '--memory=512Mi',
      '--cpu=1',
      '--timeout=300',
      '--concurrency=1000',
      '--min-instances=0',
      '--max-instances=5',
      '--set-env-vars=NODE_ENV=production'
    ]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '600s'